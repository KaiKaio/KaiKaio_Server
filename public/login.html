<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OAEP 加密登录</title>
  <script src="https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      padding: 40px;
      width: 400px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    .tab {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 16px;
      color: #999;
      transition: all 0.3s;
    }
    .tab-btn.active {
      color: #667eea;
      border-bottom: 2px solid #667eea;
      margin-bottom: -2px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button[type="submit"]:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button[type="submit"]:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }
    .message.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .message.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    .info {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
    }
    .info code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>KaiKaio 登录系统</h2>
    
    <div class="tab">
      <button class="tab-btn active" data-tab="login">登录</button>
      <button class="tab-btn" data-tab="register">注册</button>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" placeholder="请输入用户名" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="请输入密码" required>
      </div>
      <button type="submit" id="submitBtn">登录</button>
    </form>
    
    <div class="message" id="message"></div>
    
    <div class="info">
      <strong>技术说明：</strong><br>
      使用 <code>RSA-OAEP</code> 加密传输密码<br>
      后端 Node.js 22+ 已移除 <code>PKCS1</code> 支持
    </div>
  </div>

  <script>
    let currentTab = 'login';
    const API_BASE = window.location.origin;
    
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        document.getElementById('submitBtn').textContent = currentTab === 'login' ? '登录' : '注册';
        hideMessage();
      });
    });

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
    }

    function hideMessage() {
      document.getElementById('message').className = 'message';
    }

    async function getPublicKey() {
      const response = await fetch(`${API_BASE}/api/user/public_key`);
      const data = await response.json();
      return data.msg;
    }

    function encryptWithOAEP(password, publicKeyPem) {
      const publicKey = forge.pki.publicKeyFromPem(publicKeyPem);
      const encrypted = publicKey.encrypt(password, 'RSAES-OAEP');
      return forge.util.encode64(encrypted);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessage();
      
      const btn = document.getElementById('submitBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showMessage('请填写完整信息', 'error');
        return;
      }

      btn.disabled = true;
      btn.textContent = '处理中...';

      try {
        const publicKeyPem = await getPublicKey();
        const encryptedPassword = encryptWithOAEP(password, publicKeyPem);
        
        const endpoint = currentTab === 'login' ? '/api/user/login' : '/api/user/register';
        
        const response = await fetch(`${API_BASE}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userName: username,
            password: encryptedPassword
          })
        });

        const result = await response.json();

        if (result.code === 0) {
          if (currentTab === 'login') {
            localStorage.setItem('token', result.token);
            showMessage('登录成功！Token 已保存', 'success');
          } else {
            showMessage('注册成功！请切换到登录', 'success');
          }
        } else {
          showMessage(result.msg || '操作失败', 'error');
        }
      } catch (err) {
        showMessage('网络错误: ' + err.message, 'error');
        console.error(err);
      } finally {
      btn.disabled = false;
        btn.textContent = currentTab === 'login' ? '登录' : '注册';
      }
    });
  </script>
</body>
</html>
