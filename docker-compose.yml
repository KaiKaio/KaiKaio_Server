services:
  kaikaio-server:
    image: kaikaioano/kaikaio-server:branch-master
    container_name: kaikaio-server
    ports:
      - "4000:4000"
    volumes:
      - F:/Kaikaio_Booking_Server_Files:/app/app/public/upload
    env_file:
      - .env
    environment:
      - PORT=4000
      - MONGO_URI=host.docker.internal:27017/KaiKaiBlog
    restart: unless-stopped
    mem_limit: 512m